# Tests and lint only: no model, GPU, or SEC network access is needed (fixtures are self-contained).
# MLX is macOS-only, so CI installs the core package with its dev extra and not the mlx extra.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
